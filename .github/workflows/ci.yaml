name: ci
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
jobs:
  ci:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - run: nix shell nixpkgs#nix-eval-jobs nixpkgs#jq --command ./.github/nix-flake-check-ci.sh
